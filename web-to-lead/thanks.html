<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상담 신청 완료 | 프리미엄 요양원 (Web-to-Lead Demo)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f5f1; color: #1d2433;
         font-family: "Noto Sans KR", system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  .card { background: #fff; max-width: 480px; width: 100%; border-radius: 20px; padding: 48px 32px; text-align: center;
          border-top: 4px solid #b8955a; box-shadow: 0 20px 50px -24px rgba(20,40,75,.25); }
  .ok { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%; background: #f4ede1; color: #b8955a;
        display: grid; place-items: center; font-size: 30px; }
  h1 { font-family: "Noto Serif KR", serif; color: #14284b; font-size: 24px; margin: 0 0 12px; }
  p { color: #6b7385; line-height: 1.7; margin: 0 0 28px; }
  a { display: inline-block; padding: 14px 28px; border-radius: 12px; background: #14284b; color: #fff; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
  <div class="card">
    <div class="ok">✓</div>
    <h1>상담 신청이 접수되었습니다</h1>
    <p>소중한 문의 감사드립니다.<br>담당 케어 매니저가 영업일 기준 1일 이내에<br>남겨주신 연락처로 연락드리겠습니다.</p>
    <a href="index.html">처음으로</a>
  </div>
</body>
</html>
